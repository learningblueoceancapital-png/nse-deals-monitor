name: Chartink 4 Star Buy Screener

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install playwright python-dotenv

      - name: Install Playwright Chromium + system deps
        run: playwright install chromium --with-deps

      - name: Run 4 Star Buy screener and email results
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python chartink_4star_buy.py

      - name: Commit signal log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signals_raw_log.csv
          git diff --staged --quiet && exit 0
          git commit -m "Log $(date -u +%Y-%m-%d) 4-star signals"
          git pull --rebase origin main
          git push
