name: Chartink Screener Watchdog

on:
  schedule:
    - cron: '30 11 * * 1-5'   # 5:00 PM IST — after both screeners' primary + backup triggers
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check today's screener runs, re-trigger + alert on any miss
        env:
          GH_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
          GMAIL_USER:           ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python chartink_watchdog.py
