name: Momentum Portfolio - Weekday Silent Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install openpyxl

      - name: Run silent portfolio update
        run: python momentum_portfolio_build.py --mode silent

      - name: Commit updated portfolio files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio.csv signals_log.csv excluded.csv portfolio.xlsx
          git diff --staged --quiet && exit 0
          git commit -m "Momentum Portfolio: weekday silent update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
